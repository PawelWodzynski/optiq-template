# DB config
# Używanie sterownika MySQL z bazą MySQL
spring.datasource.url=jdbc:mysql://db:3306/authjwt
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Konfiguracja CORS
spring.webmvc.cors.allowed-origins=http://localhost,http://frontend,http://app-frontend
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webmvc.cors.allowed-headers=*
spring.webmvc.cors.allow-credentials=true

# Show JPA/Hibernate logging messages
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.orm.jdbc.bind=trace

# Turn off the Spring Boot Banner
spring.main.banner-mode=off

# Security JWT configuration
security.jwt.token.secret.key=your_jwt_secret_key_here

# Allow circular references for backward compatibility
spring.main.allow-circular-references=true
